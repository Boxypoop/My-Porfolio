<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <radialGradient id="irisGradient" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#12213f"/>
      <stop offset="100%" stop-color="#0a0e27"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="300" height="300" fill="none"/>

  <!-- Pulsing outer glow -->
  <circle cx="150" cy="150" r="140" fill="url(#glow)">
    <animate attributeName="r" values="130;148;130" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Iris base, dark navy to match the portfolio background -->
  <circle cx="150" cy="150" r="118" fill="url(#irisGradient)"/>

  <!-- Outer ring -->
  <circle cx="150" cy="150" r="130" fill="none" stroke="url(#ringGradient)" stroke-width="4"/>
  <circle cx="150" cy="150" r="118" fill="none" stroke="#22d3ee" stroke-width="1.5" opacity="0.5"/>

  <!-- Three Cancer loop-and-tail shapes, orbiting the pupil like tomoe around an eye -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 150 150" to="360 150 150" dur="6s" repeatCount="indefinite"/>
    <g>
      <circle cx="150" cy="86" r="15" fill="none" stroke="url(#ringGradient)" stroke-width="8"/>
      <path d="M150,101 Q172,122 150,148" fill="none" stroke="url(#ringGradient)" stroke-width="8" stroke-linecap="round"/>
    </g>
    <g transform="rotate(120 150 150)">
      <circle cx="150" cy="86" r="15" fill="none" stroke="url(#ringGradient)" stroke-width="8"/>
      <path d="M150,101 Q172,122 150,148" fill="none" stroke="url(#ringGradient)" stroke-width="8" stroke-linecap="round"/>
    </g>
    <g transform="rotate(240 150 150)">
      <circle cx="150" cy="86" r="15" fill="none" stroke="url(#ringGradient)" stroke-width="8"/>
      <path d="M150,101 Q172,122 150,148" fill="none" stroke="url(#ringGradient)" stroke-width="8" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Pupil, pulsing like the center of an eye -->
  <circle cx="150" cy="150" r="17" fill="#0a0e27" stroke="url(#ringGradient)" stroke-width="3">
    <animate attributeName="r" values="15;19;15" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="144" cy="144" r="4" fill="#ffffff" opacity="0.85"/>
</svg>
